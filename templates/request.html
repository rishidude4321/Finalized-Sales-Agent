{% extends "base.html" %}
{% block title %}Request Automation{% endblock %}
{% block content %}
  <h1>💡 Request Automation</h1>
  <div class="card">
    <form action="/submit_request" method="POST">
      <input type="hidden" name="token" value="{{ token }}">
      <label for="message">What repetitive task do you want automated?</label>
      <textarea name="message" id="message" required></textarea>
      <br><br>
      <button type="submit">Send Request</button>
    </form>
  </div>
{% endblock %}
