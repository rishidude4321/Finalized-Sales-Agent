{% extends "base.html" %}
{% block title %}Conversation Tree{% endblock %}
{% block content %}
  <h1>📋 Conversation Tree</h1>
  <div class="card">
    <p>Search for a contact:</p>
    <form action="/conversation" method="GET">
      <input type="hidden" name="token" value="{{ token }}">
      <input list="contact-list" name="email" placeholder="e.g. bob@acme.com" required>
      <datalist id="contact-list">
        {% for email in contacts %}<option value="{{ email }}">{% endfor %}
      </datalist>
      <br><br>
      <button type="submit">View Tree</button>
    </form>
  </div>

  {% if contacts %}
  <div class="card">
    <h3>Recent contacts</h3>
    <div>
      {% for email in contacts %}
        <a class="chip-contact" href="/conversation?email={{ email | urlencode }}&days=30&token={{ token }}">{{ email }}</a>
      {% endfor %}
    </div>
  </div>
  {% endif %}
{% endblock %}
