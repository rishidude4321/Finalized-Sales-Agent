{% extends "base.html" %}
{% block title %}Conversation Tree{% endblock %}
{% block content %}
  <h1>🌴 Conversation Tree</h1>

  <div class="card">
    <p>Enter a contact's email address:</p>
    <form action="/conversation" method="GET">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="email" name="email" placeholder="e.g. bob@acme.com" required>
      <br><br>
      <button type="submit">View Tree</button>
    </form>
  </div>

  {% if contacts %}
  <div class="card">
    <h3>Recent contacts</h3>
    <div>
      {% for c in contacts %}
        <a class="chip-contact"
           href="/conversation?email={{ c.email | urlencode }}&days=30&token={{ token }}">
          {{ c.display }}
        </a>
      {% endfor %}
    </div>
  </div>
  {% endif %}
{% endblock %}
