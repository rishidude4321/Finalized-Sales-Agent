name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name SalesSupportAgent run.py

      - name: Prepare final package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist\SalesSupportAgent.exe package\
          Copy-Item templates package\ -Recurse
          Copy-Item static package\ -Recurse
          Copy-Item icp_criteria.json package\
          Copy-Item invite_suggestions.json package\
          Copy-Item email_templates.json package\
          Copy-Item extra_keywords.json package\

          # Create .env from template so Sasha just opens and fills it
          Copy-Item .env.example package\.env

      - name: Smoke test in isolated folder
        shell: pwsh
        run: |
          # Use a separate test folder so final package stays clean
          New-Item -ItemType Directory -Force -Path test_package
          Copy-Item package\* test_package\ -Recurse -Force

          Add-Content -Path test_package\.env -Value "`nDONE_SECRET=ci-test-secret"
          Set-Content -Path test_package\token_cache.json -Value "{}"

          Start-Process -FilePath "test_package\SalesSupportAgent.exe" -WorkingDirectory "test_package" -WindowStyle Hidden
          Start-Sleep -Seconds 25

          $response = Invoke-WebRequest -Uri "http://localhost:8500/health?token=ci-test-secret" -UseBasicParsing

          if ($response.StatusCode -ne 200) {
            Write-Error "Health check failed with status $($response.StatusCode)"
            if (Test-Path test_package\logs\agent.log) {
              Get-Content test_package\logs\agent.log
            }
            exit 1
          }

          Write-Output "Health check passed."
          Stop-Process -Name SalesSupportAgent -Force -ErrorAction SilentlyContinue

      - name: Upload clean package
        uses: actions/upload-artifact@v4
        with:
          name: SalesSupportAgent-Windows
          path: package/