name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name SalesSupportAgent run.py

      - name: Prepare package folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist\SalesSupportAgent.exe package\
          Copy-Item templates package\ -Recurse
          Copy-Item static package\ -Recurse
          Copy-Item icp_criteria.json package\
          Copy-Item invite_suggestions.json package\
          Copy-Item email_templates.json package\
          Copy-Item extra_keywords.json package\
          Copy-Item .env.example package\

      - name: Smoke test exe on Windows
        shell: pwsh
        run: |
          # Create a minimal .env and dummy token cache so run.py doesn't launch browser auth
          Copy-Item .env.example package\.env
          Add-Content -Path package\.env -Value "`nDONE_SECRET=ci-test-secret"
          Set-Content -Path package\token_cache.json -Value "{}"

          # Start the exe in background from the package folder
          Start-Process -FilePath "package\SalesSupportAgent.exe" -WorkingDirectory "package" -WindowStyle Hidden

          # Wait for Flask to start
          Start-Sleep -Seconds 25

          # Check health page
          $response = Invoke-WebRequest -Uri "http://localhost:8500/health?token=ci-test-secret" -UseBasicParsing

          if ($response.StatusCode -ne 200) {
            Write-Error "Health check failed with status $($response.StatusCode)"
            Get-Content package\logs\agent.log -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Output "Health check passed."

          # Stop the exe
          Stop-Process -Name SalesSupportAgent -Force -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalesSupportAgent-Windows
          path: package/