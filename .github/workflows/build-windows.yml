name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name SalesSupportAgent run.py

      - name: Prepare package folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist\SalesSupportAgent.exe package\
          Copy-Item templates package\ -Recurse
          Copy-Item static package\ -Recurse
          Copy-Item icp_criteria.json package\
          Copy-Item invite_suggestions.json package\
          Copy-Item email_templates.json package\
          Copy-Item extra_keywords.json package\
          Copy-Item .env.example package\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalesSupportAgent-Windows
          path: package/